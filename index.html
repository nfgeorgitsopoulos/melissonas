<script>
/* ---------------------------------------------------------------
   Τοπική αποθήκευση για το δημόσιο demo.
   Μέσα στο claude.ai δεν ενεργοποιείται: εκεί υπάρχει το window.claude
   και η εφαρμογή χρησιμοποιεί τη βάση του λογαριασμού.
   Εδώ υλοποιεί το ίδιο API πάνω στο localStorage του φυλλομετρητή,
   ώστε το demo να δουλεύει αυτοτελώς.
   --------------------------------------------------------------- */
(function () {
  if (window.claude && window.claude.use) return;
  var KEY = 'melissonas-demo-v1';
  var store = null;
  try { store = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { store = null; }
  if (!store) { store = JSON.parse(JSON.stringify(window.__DEMO__ || {})); persist(); }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  var subs = [];
  function snapCol(name) {
    var o = store[name] || {};
    return { docs: Object.keys(o).map(function (id) {
      return { id: id, exists: true, data: function () { return clone(o[id]); } }; }) };
  }
  function snapDoc(col, id) {
    var d = (store[col] || {})[id];
    return { exists: !!d, id: id, data: function () { return d ? clone(d) : null; } };
  }
  function fire(s) {
    try { s.cb(s.type === 'col' ? snapCol(s.col) : snapDoc(s.col, s.id)); } catch (e) {}
  }
  function notify(col) { subs.forEach(function (s) { if (s.col === col) fire(s); }); }
  function later(fn) { return new Promise(function (res) { setTimeout(function () { fn(); res(); }, 30); }); }
  function split(path) { var i = path.indexOf('/'); return [path.slice(0, i), path.slice(i + 1)]; }

  var db = {
    collection: function (col) {
      return { onSnapshot: function (cb, err) {
        var s = { type: 'col', col: col, cb: cb }; subs.push(s); setTimeout(function () { fire(s); }, 0);
        return function () { subs = subs.filter(function (x) { return x !== s; }); }; } };
    },
    doc: function (path) {
      var p = split(path), col = p[0], id = p[1];
      return {
        onSnapshot: function (cb, err) {
          var s = { type: 'doc', col: col, id: id, cb: cb }; subs.push(s); setTimeout(function () { fire(s); }, 0);
          return function () { subs = subs.filter(function (x) { return x !== s; }); };
        },
        set: function (data) { return later(function () {
          store[col] = store[col] || {}; store[col][id] = clone(data); persist(); notify(col); }); },
        update: function (data) { return later(function () {
          store[col] = store[col] || {}; var cur = store[col][id] || {};
          Object.keys(data).forEach(function (k) { cur[k] = clone(data[k]); });
          store[col][id] = cur; persist(); notify(col); }); },
        delete: function () { return later(function () {
          if (store[col]) delete store[col][id]; persist(); notify(col); }); }
      };
    }
  };
  var downloads = {
    save: function (o) {
      return new Promise(function (res) {
        var b = new Blob([o.data], { type: 'application/octet-stream' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = o.filename;
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); res(); }, 100);
      });
    }
  };
  window.claude = { use: function (what) {
    return Promise.resolve(what === 'db' ? db : what === 'downloads' ? downloads : null); } };
  window.melissonasResetDemo = function () { localStorage.removeItem(KEY); location.reload(); };

  /* Οθόνη καλωσορίσματος: μόνο στην πρώτη επίσκεψη. */
  var SEEN = KEY + '-welcome';
  function welcome() {
    try { if (localStorage.getItem(SEEN)) return; } catch (e) { return; }
    var w = document.createElement('div');
    w.setAttribute('role', 'dialog');
    w.setAttribute('aria-modal', 'true');
    w.setAttribute('aria-labelledby', 'dw-h');
    w.style.cssText = 'position:fixed;inset:0;z-index:9999;background:var(--scrim,rgba(0,0,0,.45));display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto';
    w.innerHTML =
      '<div style="background:var(--surface,#fff);color:var(--fg,#1C1B17);border-radius:18px;padding:22px;max-width:420px;width:100%;font-family:var(--f-ui,system-ui,sans-serif);box-shadow:0 18px 48px rgba(0,0,0,.28);max-height:92vh;overflow:auto">' +
        '<h2 id="dw-h" style="margin:0 0 10px;font-size:20px;line-height:1.3">Πριν ξεκινήσεις</h2>' +
        '<p style="margin:0 0 12px;font-size:15px;line-height:1.5">Αυτή είναι η δημόσια έκδοση της εφαρμογής. Αυτή τη στιγμή βλέπεις ένα <b>φανταστικό μελισσοκομείο</b>, για να περιηγηθείς ελεύθερα.</p>' +
        '<p style="margin:0 0 12px;font-size:15px;line-height:1.5">Για να την κάνεις δική σου, πάτα «Ξεκίνα καθαρά». Τα δοκιμαστικά δεδομένα σβήνονται και καταχωρίζεις τα δικά σου μελισσοκομεία και κυψέλες.</p>' +
        '<div style="background:var(--sunk,#ECEAE3);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.5">' +
          '<b>Πού πάνε τα δεδομένα σου</b><br>Μένουν αποθηκευμένα μόνο σε αυτόν τον φυλλομετρητή, σε αυτή τη συσκευή. Δεν τα βλέπει κανένας άλλος, ούτε ο δημιουργός της εφαρμογής. Δεν συγχρονίζονται με άλλες συσκευές και χάνονται αν καθαρίσεις τα δεδομένα περιήγησης, γι’ αυτό <b>κράτα τακτικά αντίγραφο</b>: μενού (≡) → Ρυθμίσεις &amp; αντίγραφα.' +
        '</div>' +
        '<p style="margin:0 0 16px;font-size:14px;line-height:1.5;opacity:.8">Σε κινητό: από το μενού του φυλλομετρητή διάλεξε «Προσθήκη στην αρχική οθόνη» και θα ανοίγει σαν κανονική εφαρμογή.</p>' +
        '<div style="display:grid;gap:8px">' +
          '<button id="dw-clean" style="min-height:46px;border:none;border-radius:12px;background:var(--accent,#A35F00);color:var(--on-accent,#fff);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer">Ξεκίνα καθαρά</button>' +
          '<button id="dw-keep" style="min-height:46px;border:1px solid var(--line,#E4E2DA);border-radius:12px;background:var(--surface,#fff);color:inherit;font-size:15px;font-family:inherit;cursor:pointer">Περιήγηση με τα δοκιμαστικά δεδομένα</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(w);
    var close = function () { try { localStorage.setItem(SEEN, '1'); } catch (e) {} w.remove(); };
    w.querySelector('#dw-keep').onclick = close;
    w.querySelector('#dw-clean').onclick = function () {
      if (!confirm('Θα σβηστούν τα δοκιμαστικά δεδομένα και η εφαρμογή θα ξεκινήσει άδεια. Συνέχεια;')) return;
      try { localStorage.setItem(KEY, '{}'); localStorage.setItem(SEEN, '1'); } catch (e) {}
      location.reload();
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', welcome);
  else welcome();
})();

function cmpRows(){
  var f = S.form, y = today().slice(0, 4), rk = {};
  rankAll(y).forEach(function(o){ rk[o.x.id] = o; });
  var rows = activeHives().filter(function(x){ return f.ap === 'all' || x.apiary === f.ap; }).map(function(x){
    var o = rk[x.id] || {score: null, honey: 0, why: []}, q = x.queen || {}, v = x.lastVarroa;
    return {x:x, score:o.score, honey:o.honey || 0, why:o.why || [],
      str: {weak:0, medium:1, strong:2}[x.strength || 'medium'],
      vr: v ? (v.kind === 'pct' ? v.value / (S.settings.varroaPct || 3) : v.value / (S.settings.varroaDay || 10)) : null,
      brood: x.lastBrood != null ? Number(x.lastBrood) : null,
      qy: q.year ? Number(q.year) : null, insp: x.lastInspection || ''};
  });
  var k = f.sort || 'num', d = f.dir === 'desc' ? -1 : 1;
  function val(r){ return k === 'num' ? Number(r.x.num) || 0 : k === 'str' ? r.str : k === 'vr' ? r.vr : k === 'brood' ? r.brood : k === 'qy' ? r.qy : k === 'insp' ? r.insp : k === 'honey' ? r.honey : r.score; }
  rows.sort(function(a, b){
    var va = val(a), vb = val(b);
    if (va == null && vb == null) return byNum(a.x, b.x);
    if (va == null) return 1; if (vb == null) return -1;
    var c = va < vb ? -1 : va > vb ? 1 : 0;
    return c * d || byNum(a.x, b.x);
  });
  return rows;
}

  if (k0 === k1) { var items = (S.logs[k0] || []).map(function(e){ return e.id === old.id ? ev : e; }); S.logs[k0] = items; return put('log', k0, {items: items}); }
  return removeLog(old).then(function(){ var it2 = (S.logs[k1] || []).slice(); it2.push(ev); S.logs[k1] = it2; return put('log', k1, {items: it2}); });
}

A.saveInspection = function(d){
  var x = hive(S.params.id), f = S.form, date = f.date || today(), vr = null;
  if (f.vOn) { vr = varroaFromForm(f); if (!vr) { toast('Συμπλήρωσε σωστά τη μέτρηση βαρρόα ή απενεργοποίησέ τη'); return; } }

    var ne = Object.assign({id: old.id, at: old.at, type:'inspection', date: date, hives:[x.id]}, inspFields(f, x));
    if (f.supers0 == null && old.brood != null && ne.brood == null) { ne.brood = old.brood; ne.honey = old.honey; }
    if (vr) ne.varroa = vr;
    run(async function(){ await replaceLog(old, ne); await hiveRecompute(x.id); back(); }, 'Οι αλλαγές αποθηκεύτηκαν');
    return;
  }
  var nx = nextHive(x).next, goNext = d && d.next && nx;
  run(async function(){
    var ev = Object.assign({type:'inspection', date: date, hives:[x.id]}, inspFields(f, x));
    if (vr) ev.varroa = vr;
    await addLog(ev);
    var upd = {strength: f.strength, lastLevels: {open: f.open, sealed: f.sealed, bees: f.bees, pollen: f.pollen, honey: f.honeyL}, lastTemper: f.temper || null, lastHealth: inspHealth(ev).lvl};
    if (ev.brood != null) { upd.lastBrood = ev.brood; upd.lastHoney = ev.honey; }
    if (f.supers !== Math.max(0, (x.floors || 1) - 1)) { upd.floors = 1 + f.supers; await addLog({type:'change', date: date, hives:[x.id], text:'Μελιτοθάλαμοι: ' + Math.max(0, (x.floors || 1) - 1) + ' → ' + f.supers}); }
    if (!x.lastInspection || date >= x.lastInspection) upd.lastInspection = date;
    if (vr && (!x.lastVarroa || date >= x.lastVarroa.date)) upd.lastVarroa = {date: date, method: vr.method, kind: vr.kind, value: vr.value};
    await patch('hives', x.id, upd);

    else back();

A.saveFeed = function(){
  var f = S.form;
  if (!f.hives.length) { toast('Διάλεξε κυψέλες'); return; }
  var need = feedNeed(f.food, f.amt * f.hives.length), have = feedHave(f.food), nm = foodStockName(f.food);
  if (need > have + 1e-9) { toast('Δεν φτάνει το απόθεμα: χρειάζεσαι ' + r2(need) + ' kg ' + nm.toLowerCase() + ', έχεις ' + num(have) + ' kg'); return; }
  var items = feedItems(f.food), left = need, take = [];
  items.forEach(function(x){ if (left <= 0) return; var q = r3(Math.min(left, Number(x.qty) || 0)); if (q > 0) { take.push([x, q]); left = r3(left - q); } });
  run(async function(){
    var ev = {type:'feed', date: f.date || today(), hives: f.hives, food: f.food, perHive: f.amt, unit: foodInfo(f.food)[1]};
    if (take.length) { ev.stock = {id: take[0][0].id, qty: take[0][1]}; if (take.length > 1) ev.stocks = take.map(function(t){ return {id: t[0].id, qty: t[1]}; }); }
    for (var i = 0; i < take.length; i++) await patch('inventory', take[i][0].id, {qty: r3((Number(take[i][0].qty) || 0) - take[i][1])});
    await addLog(ev); S.form.hives = [];
  }, 'Το τάισμα καταχωρίστηκε' + (need > 0 ? ' · αφαιρέθηκαν ' + r2(need) + ' kg ' + nm.toLowerCase() + ' από την Αποθήκη' : ''));
};

A.hcMove = function(d){ var c = homeCfg(), i = c.order.indexOf(d.k), j = i + Number(d.d); if (j < 0 || j >= c.order.length) return; c.order.splice(i, 1); c.order.splice(j, 0, d.k); hcSave(c); };
A.hcTile = function(d){ var c = homeCfg(), on = {}; HOME_TILES.forEach(function(x){ on[x[0]] = tileOn(c, x[0]); }); on[d.k] = !on[d.k]; c.tilesOn = on; hcSave(c); };
A.hcTMove = function(d){ var c = homeCfg(), i = c.tOrder.indexOf(d.k), j = i + Number(d.d); if (j < 0 || j >= c.tOrder.length) return; c.tOrder.splice(i, 1); c.tOrder.splice(j, 0, d.k); hcSave(c); };
A.hcReset = function(){ hcSave(null); toast('Η Αρχική επανήλθε στην προεπιλογή'); };
A.calMove = function(d){ var f = S.form, y = Number(f.ym.slice(0, 4)), m = Number(f.ym.slice(5, 7)) - 1 + Number(d.d); var dt = new Date(y, m, 1); f.ym = dt.getFullYear() + '-' + pad(dt.getMonth() + 1); f.sel = f.ym === today().slice(0, 7) ? today() : f.ym + '-01'; render(true); };
A.calSel = function(d){ S.form.sel = d.d; render(true); };
A.calToday = function(){ S.form.ym = today().slice(0, 7); S.form.sel = today(); render(true); };
A.calHide = function(d){ var h = S.form.hide = S.form.hide || {}; h[d.k] = !h[d.k]; render(true); };
A.openBuyPdf = function(){ S.form.bp = {store: S.form.bstore || 'all', q:'', off:{}}; S.sheet = 'buyPdf'; render(true); };
A.bpStore = function(d){ S.form.bp.store = d.val; render(true); };
A.bpTog = function(d){ var o = S.form.bp.off; o[d.k] = !o[d.k]; render(true); };
A.bpAll = function(d){ var f = S.form.bp; buyItems().forEach(function(x){ if (bpMatch(f, x)) f.off[x.key] = d.v !== '1'; }); render(true); };
A.makeBuyPdf = function(){
  var f = S.form.bp;
  var items = buyItems().filter(function(x){ return bpMatch(f, x) && !f.off[x.key]; });
  if (!items.length) { toast('Διάλεξε τουλάχιστον ένα είδος'); return; }
  if (!dl) { toast('Η λήψη αρχείων δεν είναι διαθέσιμη εδώ'); return; }
  toast('Ετοιμάζεται το PDF…');
  (async function(){
    var host = document.createElement('div');
    try {
      await pdfLibs();
      host.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1';
      document.body.appendChild(host);
      var pdf = new window.jspdf.jsPDF({unit:'pt', format:'a4', compress:true}), pages = buyPdfPages(items, f);
      for (var i = 0; i < pages.length; i++) {
        host.innerHTML = pages[i];
        var cv = await window.html2canvas(host.firstChild, {scale: 2, backgroundColor:'#ffffff', logging:false});
        if (i) pdf.addPage();
        pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 595.28, 841.89);
      }
      var name = 'lista-agoron' + (f.store !== 'all' && f.store !== 'none' ? '-' + String(f.store).trim().replace(/\s+/g, '-') : '') + '-' + today() + '.pdf';
      var ok = await save(name, pdf.output('blob'));
      if (ok) { S.sheet = null; render(true); }
    } catch (e) { toast('Δεν ήταν δυνατή η δημιουργία PDF. Έλεγξε τη σύνδεση και δοκίμασε ξανά.'); }
    finally { if (host.parentNode) host.parentNode.removeChild(host); }
  })();
};
A.foodTog = function(){ S.form.foodOpen = !S.form.foodOpen; render(true); };
A.foodPick = function(d){ S.form.food = d.val; S.form.foodOpen = false; render(true); };
A.buyTog = function(){ S.buyOpen = !buyIsOpen(); try { localStorage.setItem('mel.buyOpen', S.buyOpen ? '1' : '0'); } catch (e) {} render(true); };
A.prioCycle = function(d){ var x = S.tasks.filter(function(t){ return t.id === d.id; })[0]; if (!x) return; var nx = {'high':'med', 'med':'low', 'low':'high'}[x.prio] || 'high'; x.prio = nx; render(true); run(async function(){ await patch('tasks', x.id, {prio: nx}); }, 'Προτεραιότητα: ' + prioOf(nx)[1]); };
A.boSel = function(d, el){ var f = S.form; f.ov[d.h] = f.ov[d.h] || {}; f.ov[d.h][d.k] = el.value; render(true); };
A.boTog = function(d){ var f = S.form; f.ov[d.h] = f.ov[d.h] || {}; f.ov[d.h][d.k] = !bulkVal(f, d.h, d.k); render(true); };
A.boReset = function(d){ delete S.form.ov[d.h]; render(true); };
A.saveBulk = function(){
  var f = S.form, ids = (f.hives || []).filter(function(id){ return hive(id); }), date = f.date || today();
  if (!ids.length) { toast('Διάλεξε κυψέλες'); return; }
  run(async function(){
    for (var i = 0; i < ids.length; i++) {
      var x = hive(ids[i]), ev = Object.assign({type:'inspection', date: date, hives:[x.id], bulk: true}, bulkEvent(f, x.id));
      await addLog(ev);
      var upd = {strength: ev.strength, lastLevels: {open: ev.open, sealed: ev.sealed, bees: ev.bees, pollen: ev.pollen, honey: ev.honeyL}, lastTemper: ev.temper || null, lastHealth: inspHealth(ev).lvl};
      if (ev.brood != null) { upd.lastBrood = ev.brood; upd.lastHoney = ev.honey; }
      if (!x.lastInspection || date >= x.lastInspection) upd.lastInspection = date;
      await patch('hives', x.id, upd);
    }
    back();
  }, plural(ids.length, 'επιθεώρηση αποθηκεύτηκε', 'επιθεωρήσεις αποθηκεύτηκαν'));
};
A.bulkFromPick = function(){ var ap = S.form.ip; S.sheet = null; go('bulkInsp', {ap: ap}); };
A.feedToBuy = function(){ var f = S.form, nm = foodStockName(f.food), need = feedNeed(f.food, f.amt * f.hives.length), miss = r3(need - feedHave(f.food));
  var ex = S.tasks.filter(function(x){ return x.cat === 'buy' && !x.done && elCmp(x.title, nm) === 0; })[0];
  if (ex) { toast('Η «' + nm + '» είναι ήδη στα «Προς αγορά»'); return; }
  run(async function(){ await put('tasks', uid(), {title: nm, note: 'Λείπουν ' + r2(miss) + ' kg για τάισμα', cat:'buy', prio:'high', store:'', apiary:'', date:'', done:false, created: new Date().toISOString()}); }, 'Η «' + nm + '» μπήκε στα «Προς αγορά» με υψηλή προτεραιότητα'); };
A.feedToStock = function(){ var nm = foodStockName(S.form.food), it = feedStock(S.form.food); if (it) go('invForm', {id: it.id}); else { go('invForm'); S.form.cat = String(FOOD_CAT); S.form.item = INV_CATS[FOOD_CAT][1].indexOf(nm) >= 0 ? nm : '__other'; if (S.form.item === '__other') S.form.custom = nm; S.form.unit = 'kg'; S.form.cond = 'good'; render(true); } };
A.closeSheet = function(){ S.sheet = null; render(true); };
A.confirmNo = function(){ S.confirm = null; render(true); };
A.confirmYes = function(){ var fn = S.confirm && S.confirm.fn; S.confirm = null; if (fn) fn(); else render(true); };

/* settings */
function saveSettings(){ var st = S.settings; return put('settings', 'main', {inspectDays: st.inspectDays || 14, varroaPct: st.varroaPct || 3, varroaDay: st.varroaDay || 10, inspMode: st.inspMode || 'detailed', lastExport: st.lastExport || '', home: st.home || null}); }
A.inspDays = function(d){ var v = Math.max(3, Math.min(60, (S.settings.inspectDays || 14) + Number(d.d))); S.settings.inspectDays = v; render(true); run(saveSettings); };
A.setThr = function(d){ var cur = Number(S.settings[d.k]) || (d.k === 'varroaPct' ? 3 : 10); var v = Math.max(Number(d.min), Math.min(Number(d.max), Math.round((cur + Number(d.d)) * 10) / 10)); S.settings[d.k] = v; render(true); run(saveSettings); };
function dump(){ return {app:'melissonas', version:1, exported: new Date().toISOString(), apiaries:S.apiaries, hives:S.hives, treatments:S.treatments, tasks:S.tasks, blooms:S.blooms, plants:S.plants, inventory:S.inventory, products:S.products, rearing:S.rearing, finance:S.finance, queens:S.queens, logs:S.logs, settings:S.settings}; }
async function save(filename, data){
  if (!dl) { toast('Η λήψη αρχείων δεν είναι διαθέσιμη εδώ'); return false; }
  try { await dl.save({filename: filename, data: data}); toast('Το αρχείο αποθηκεύτηκε'); return true; }
  catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') toast('Περίμενε λίγο και δοκίμασε ξανά'); else toast('Η λήψη δεν ολοκληρώθηκε'); }
}
A.exportJson = function(){ save('melissonas-' + today() + '.json', JSON.stringify(dump(), null, 1)).then(function(ok){ if (ok) { S.settings.lastExport = today(); render(true); run(saveSettings); } }); };
A.bkLater = function(){ S.bkSnooze = true; render(true); };
function backupDue(){ var l = S.settings.lastExport; return S.hives.length > 0 && (!l || diffDays(l, today()) >= 30); }
A.exportCsv = function(){
  var q = function(v){ v = String(v == null ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [['Ημερομηνία','Είδος','Τίτλος','Λεπτομέρειες','Κυψέλες','Πλήθος κυψελών']];
  allEvents().slice().reverse().forEach(function(e){ var t = eventText(e); rows.push([e.date, e.type, t[0], t[1], hivesSummary(e.hives || []), (e.hives || []).length]); });
  save('melissonas-katachoriseis-' + today() + '.csv', '﻿' + rows.map(function(r){ return r.map(q).join(';'); }).join('\r\n'));
};
A.importJson = function(d, el){
  var file = el.files && el.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data; try { data = JSON.parse(reader.result); } catch (e) { toast('Το αρχείο δεν είναι έγκυρο αντίγραφο'); return; }
    if (!data || data.app !== 'melissonas') { toast('Το αρχείο δεν είναι αντίγραφο του Μελισσώνα'); return; }
    S.confirm = {title:'Επαναφορά από αντίγραφο;', text:'Όλα τα τρέχοντα δεδομένα θα αντικατασταθούν με αυτά του αρχείου (' + (data.hives || []).length + ' κυψέλες, ' + (data.apiaries || []).length + ' μελισσοκομεία, εξαγωγή ' + fmtD(String(data.exported || '').slice(0, 10)) + ').', yes:'Επαναφορά', danger:true, fn: function(){ run(function(){ return restore(data); }, 'Η επαναφορά ολοκληρώθηκε'); }};
    render(true);
  };
  reader.readAsText(file);
  el.value = '';
};
async function restore(data){
  var cols = {apiaries:S.apiaries, hives:S.hives, treatments:S.treatments, tasks:S.tasks, blooms:S.blooms, inventory:S.inventory, products:S.products, rearing:S.rearing, finance:S.finance, queens:S.queens};
  S.qMig = true;
  for (var c in cols) for (var i = 0; i < cols[c].length; i++) await del(c, cols[c][i].id);
  for (var k in S.logs) await del('log', k);
  for (var c2 in cols) {
    var list = data[c2] || [];
    for (var j = 0; j < list.length; j++) { var o = fd(list[j]); var id = o.id; delete o.id; await put(c2, id, o); }
  }
  for (var lk in (data.logs || {})) await put('log', lk, {items: data.logs[lk]});
  if (data.settings) await put('settings', 'main', {inspectDays: data.settings.inspectDays || 14, varroaPct: data.settings.varroaPct || 3, varroaDay: data.settings.varroaDay || 10, inspMode: data.settings.inspMode || 'detailed'});
  S.qMig = false;
  await put('settings', 'plants', {items: data.plants || []});
  S.stack = []; S.view = 'home';
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]'); if (!el) return;
  var fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault();
  if (el.getAttribute('aria-disabled') === 'true' && ['saveApiary','saveHive','saveTreatment','saveFeed','saveHarvest','obNext','pickApply','saveBloom','saveInv','saveProd'].indexOf(el.dataset.a) >= 0) {
    var msg = {saveApiary:'Γράψε όνομα και διάλεξε είδος μελισσοκομείου', saveHive:'Συμπλήρωσε μελισσοκομείο και αριθμό (χωρίς διπλότυπο)', saveTreatment:'Συμπλήρωσε σκεύασμα και κυψέλες', saveFeed:'Διάλεξε κυψέλες', saveHarvest:'Διάλεξε κυψέλες και ποσότητα', obNext:'Γράψε όνομα και διάλεξε είδος μελισσοκομείου', pickApply:'Διάλεξε τουλάχιστον μία κυψέλη', saveBloom:'Συμπλήρωσε όλα τα πεδία με αστερίσκο (*)', saveInv:'Συμπλήρωσε κατηγορία, εξοπλισμό, ποσότητα και κατάσταση', saveProd:'Διάλεξε προϊόν, ποσότητα και μονάδα'}[el.dataset.a];
    toast(msg); return;
  }
  fn(el.dataset, el, e);
});
document.addEventListener('change', function(e){ var el = e.target; var n = el.getAttribute('data-a-change'); if (n && A[n]) A[n](el.dataset, el, e); });
document.addEventListener('input', function(e){
  var el = e.target, ds = el.dataset;
  if (ds.lvl) { var v = Number(el.value); S.form[ds.lvl] = v; el.style.setProperty('--p', (v * 20) + '%'); el.setAttribute('aria-valuetext', LEVELS[v]); var lab = document.getElementById('lvv-' + ds.lvl); if (lab) lab.textContent = LEVELS[v]; return; }
  if (ds.bind) { S.form[ds.bind] = el.value; }
  else if (ds.ob) { S.ob[ds.ob] = el.value; }
  else if (ds.tk) { S.form.t[ds.tk] = el.value; return; }
  else if (ds.bt) { S.form.bt[ds.bt] = el.value; return; }
  else if (ds.bo) { var pp = ds.bo.split(':'), f0 = S.form; f0.ov[pp[0]] = f0.ov[pp[0]] || {}; f0.ov[pp[0]][pp[1]] = pp[1] === 'notes' ? el.value : (el.value === '' ? 0 : Number(el.value)); return; }
  else if (ds.bp) { S.form.bp[ds.bp] = el.value; if (ds.bp === 'q') liveRefresh(el); return; }
  else if (ds.q) { S.form.q[ds.q] = el.value; return; }
  else if (ds.hq) { S.form.h.qty = Number(String(el.value).replace(',', '.')) || 0; return; }
  else if (ds.hd) { S.form.h.date = el.value; return; }
  else if (ds.hv) { S.form.h.variety = el.value; return; }
  else return;
  if (ds.live || ds.ob) liveRefresh(el);
});
/* re-render while typing without losing focus or caret */
function liveRefresh(el){
  var id = el.id, s = el.selectionStart, en = el.selectionEnd;
  render(true);
  var n = id && document.getElementById(id);
  if (n) { n.focus(); try { if (s != null) n.setSelectionRange(s, en); } catch (x) {} }
}
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { if (S.menu) { S.menu = false; render(true); } else if (S.confirm) { S.confirm = null; render(true); } else if (S.picker) { S.picker = null; render(true); } else if (S.sheet) { S.sheet = null; render(true); } }
});

/* ---------- boot ---------- */
function subscribe(col, key){
  db.collection(col).onSnapshot(function(snap){
    S[key] = snap.docs.map(function(d){ var o = fd(d.data() || {}); o.id = d.id; return o; });
    S.loaded[key] = true; if (key === 'hives' || key === 'queens') migrateQueens(); render();
  }, function(err){ S.loaded[key] = true; toast(errMsg(err)); render(); });
}
(async function(){
  render(true);
  var c = window.claude;
  try { db = c && c.use ? await c.use('db') : null; } catch (e) { db = null; }
  try { dl = c && c.use ? await c.use('downloads') : null; } catch (e) { dl = null; }
  if (!db) { S.noDb = true; render(true); return; }
  subscribe('apiaries', 'apiaries'); subscribe('hives', 'hives'); subscribe('treatments', 'treatments'); subscribe('tasks', 'tasks'); subscribe('blooms', 'blooms'); subscribe('inventory', 'inventory'); subscribe('products', 'products'); subscribe('rearing', 'rearing'); subscribe('finance', 'finance'); subscribe('queens', 'queens');
  db.collection('log').onSnapshot(function(snap){
    var logs = {}; snap.docs.forEach(function(d){ var b = d.data() || {}; logs[d.id] = (b.items || []).slice(); });
    S.logs = logs; S.loaded.log = true; render();
  }, function(err){ toast(errMsg(err)); });
  db.doc('settings/plants').onSnapshot(function(snap){ S.plants = snap.exists ? ((snap.data() || {}).items || []).slice() : []; render(); }, function(){});
  db.doc('settings/main').onSnapshot(function(snap){ if (snap.exists) { var b = snap.data(); S.settings = {inspectDays: b.inspectDays || 14, varroaPct: b.varroaPct || 3, varroaDay: b.varroaDay || 10, inspMode: b.inspMode || 'detailed', lastExport: b.lastExport || '', home: b.home || null}; } render(); }, function(){});
})();
})();
</script>
